[package]
name = "trusty-cryptoprov-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords = ["crypto", "provider"]
description = "Crypto provider traits, common types, and errors (no provider SDK dependencies)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tracing = "0.1"
secrecy = { version = "0.10", features = ["serde"] }
zeroize = "1"

[dev-dependencies]
tempfile = "3"

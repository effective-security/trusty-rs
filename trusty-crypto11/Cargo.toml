[package]
name = "trusty-crypto11"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Denis Issoupov <denis@tbilicode.com>"]
repository = "https://github.com/effective-security/trusty-rs"
keywords = ["crypto", "pkcs11"]
description = "PKCS#11 HSM adapter"

[dependencies]
cryptoki = "0.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tracing = "0.1"
spki = { version = "0.8.0", features = ["alloc"] }
pkcs8 = { version = "0.11.0", features = ["alloc"] }
der = { version = "0.8", features = ["derive", "oid", "alloc"] }
pem-rfc7468 = { version = "1.0.0", features = ["alloc"] }
rsa = { version = "0.9", features = ["sha2"] }
p256 = { version = "0.14.0", features = ["ecdsa", "pkcs8"] }
p384 = { version = "0.14.0", features = ["ecdsa", "pkcs8"] }
p521 = { version = "0.14.0", features = ["ecdsa", "pkcs8"] }
secrecy = { version = "0.10.3", features = ["serde"] }
num-integer = "0.1.46"

[dev-dependencies]
tempfile = "3"
sha2 = "0.11.0"

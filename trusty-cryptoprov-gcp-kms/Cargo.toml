[package]
name = "trusty-cryptoprov-gcp-kms"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords = ["crypto", "gcp", "kms"]
description = "GCP KMS signing provider for trusty-cryptoprov"

[dependencies]
trusty-cryptoprov-core.workspace = true
google-cloud-kms-v1 = "1"
google-cloud-gax = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
bytes = "1"
crc32c = "0.6"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

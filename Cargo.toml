[workspace]
resolver = "3"
members = [
    "trusty-crypto11",
    "trusty-cryptoprov-core",
    "trusty-cryptoprov-inmem",
    "trusty-cryptoprov-pkcs11",
    "trusty-cryptoprov-aws-kms",
    "trusty-cryptoprov-gcp-kms",
    "trusty-cryptoprov",
    "apps/hsm-tool",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Denis Issoupov <denis@tbilicode.com>"]
repository = "https://github.com/effective-security/trusty-rs"

[workspace.dependencies]
trusty-crypto11 = { version = "0.1.0", path = "trusty-crypto11" }
trusty-cryptoprov-core = { version = "0.1.0", path = "trusty-cryptoprov-core" }
trusty-cryptoprov-inmem = { version = "0.1.0", path = "trusty-cryptoprov-inmem" }
trusty-cryptoprov-pkcs11 = { version = "0.1.0", path = "trusty-cryptoprov-pkcs11" }
trusty-cryptoprov-aws-kms = { version = "0.1.0", path = "trusty-cryptoprov-aws-kms" }
trusty-cryptoprov-gcp-kms = { version = "0.1.0", path = "trusty-cryptoprov-gcp-kms" }

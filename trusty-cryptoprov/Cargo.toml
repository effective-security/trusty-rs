[package]
name = "trusty-cryptoprov"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Denis Issoupov <denis@tbilicode.com>"]
repository = "https://github.com/effective-security/trusty-rs"
keywords = ["crypto", "pkcs11", "hsm"]
description = "Crypto provider facade (PKCS#11, inmem, PEM/URI/GCM helpers)"

[features]
default = []
inmem = ["dep:trusty-cryptoprov-inmem"]
pkcs11 = ["dep:trusty-cryptoprov-pkcs11"]
aws-kms = ["dep:trusty-cryptoprov-aws-kms"]
gcp-kms = ["dep:trusty-cryptoprov-gcp-kms"]

[dependencies]
trusty-cryptoprov-core = { path = "../trusty-cryptoprov-core" }
trusty-cryptoprov-inmem = { path = "../trusty-cryptoprov-inmem", optional = true }
trusty-cryptoprov-pkcs11 = { path = "../trusty-cryptoprov-pkcs11", optional = true }
trusty-cryptoprov-aws-kms = { path = "../trusty-cryptoprov-aws-kms", optional = true }
trusty-cryptoprov-gcp-kms = { path = "../trusty-cryptoprov-gcp-kms", optional = true }
thiserror = "2"
tracing = "0.1"
aes-gcm = "0.11.0"
aes = "0.9.2"
rand = "0.10.2"
pem = "4.0.0"
x509-cert = { version = "0.3.0", features = ["pem"] }
sha1 = { version = "0.11.0", features = ["oid"] }
sha2 = { version = "0.11.0", features = ["oid"] }

[dev-dependencies]
tempfile = "3"
# Only used by `keys.rs`'s own tests, to independently re-derive a public key
# from testdata DER and verify a signature (rather than trusting the `Signer`
# trait object's output blindly).
rsa = { version = "0.9", features = ["pem", "sha2", "getrandom"] }

[[test]]
name = "load_inmem"
required-features = ["inmem"]

[[test]]
name = "load_softhsm"
required-features = ["pkcs11"]

[[test]]
name = "pkcs11_sign"
required-features = ["pkcs11"]
